name: Update data and predictions

on:
  schedule:
    # Monday: weekend results in, midweek fixtures out
    # Thursday: midweek results in, weekend fixtures out (Friday night games included)
    # 06:00 UTC is 08:00 or 09:00 in Greece
    - cron: "0 6 * * 1,4"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # lets the workflow commit the predictions/ folder

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Download current season and fixtures
        run: python -m src.download

      - name: Load new matches
        run: python -m src.ingest

      - name: Recalculate Elo
        run: python -m src.elo

      - name: Predict upcoming fixtures
        run: python -m src.predict

      # Commit this run's predictions, so git's public history timestamps them
      - name: Publish new predictions
        run: |
          if [ ! -d predictions ]; then
            echo "No new predictions to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions
          if git diff --cached --quiet; then
            echo "No new predictions to publish"
          else
            git commit -m "Predictions made $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # Last, so a scoring problem can never stop predictions being published
      - name: Score live predictions
        run: python -m src.live_score
