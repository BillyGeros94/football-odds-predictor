name: Update data and predictions

on:
  schedule:
    # Monday: weekend results in, midweek fixtures out
    # Thursday: midweek results in, weekend fixtures out (Friday night games included)
    # GitHub's schedule is best effort and can skip a run, so each day has a second,
    # later run as a backup. Running twice is harmless: saved predictions never change,
    # and the season simulation is skipped when no new results have arrived.
    # 06:00 and 14:00 UTC are 08:00 and 16:00 in Greece (an hour earlier in summer)
    - cron: "0 6 * * 1,4"
    - cron: "0 14 * * 1,4"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # lets the workflow commit the predictions/ folder

# Never let two runs overlap: a second one waits for the first to finish
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download current season and fixtures
        run: python -m src.download

      - name: Load new matches
        run: python -m src.ingest

      - name: Recalculate Elo
        run: python -m src.elo

      # After loading and rating, before predicting: the leakage tests compare the feature
      # view with every stored match, so they need Elo rebuilt for the newest matches.
      # Running them earlier would let one half-finished run block every later run;
      # here a failure still stops bad predictions, and the next run can repair itself.
      - name: Run tests
        run: python -m pytest

      - name: Predict upcoming fixtures
        run: python -m src.predict

      - name: Set up git for the bot's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commit this run's predictions, so git's public history timestamps them.
      # pull --rebase first, in case someone pushed to main while this run was going.
      - name: Publish new predictions
        run: |
          if [ ! -d predictions ]; then
            echo "No new predictions to publish"
            exit 0
          fi
          git add predictions
          if git diff --cached --quiet; then
            echo "No new predictions to publish"
          else
            git commit -m "Predictions made $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      # GitHub switches off scheduled runs after 60 days without a commit, which would
      # happen every summer with no matches to predict. An empty commit keeps it on.
      - name: Keep the schedule active
        run: |
          days_since=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $days_since days ago"
          if [ "$days_since" -ge 45 ]; then
            git commit --allow-empty -m "Keep the scheduled workflow active"
            git pull --rebase
            git push
          fi

      # Last, so a scoring problem can never stop predictions being published
      - name: Score live predictions
        run: python -m src.live_score

      - name: Simulate the rest of the season
        run: python -m src.simulate
